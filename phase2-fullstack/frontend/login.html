<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSpend — Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons (optional but useful) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN Link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row mt-5">
        <div class="col-6 offset-3">
          <div class="card p-4 shadow-sm">
            <div class="text-center mb-4">
              <img
                src="images/logoName.png"
                alt="SmartSpend"
                style="width: 200px"
              />
              <p class="text-muted mt-2" style="font-size: 14px">
                Welcome back! Please <b>login</b> to continue.
              </p>
            </div>

            <form
              action="/login"
              method="post"
              class="needs-validation"
              novalidate
            >
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  name="email"
                  id="email"
                  type="email"
                  placeholder="enter your registered email"
                  class="form-control"
                  required
                />
                <div class="invalid-feedback">Please enter valid email.</div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group has-validation">
                  <input
                    name="password"
                    id="password"
                    type="password"
                    placeholder="enter your password"
                    class="form-control"
                    required
                  />
                  <span
                    class="input-group-text"
                    id="togglePassword"
                    style="cursor: pointer"
                  >
                    <i class="fa-regular fa-eye" id="eyeIcon"></i>
                  </span>
                </div>
                <div class="invalid-feedback">Password is required.</div>
              </div>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="rememberMe"
                  />
                  <label
                    class="form-check-label"
                    for="rememberMe"
                    style="font-size: 13px; color: #666"
                  >
                    Remember me
                  </label>
                </div>
                <a href="forgotPwd.html" class="forgot-link mb-0">
                  Forgot Password?
                </a>
              </div>

              <button class="btn btn-success w-100 mt-2">Login</button>

              <div class="divider-text text-center mt-2">Or</div>
              <button
                type="button"
                class="btn w-100 mt-2 google-btn d-flex align-items-center position-relative"
              >
                <img
                  src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                  width="22"
                  height="22"
                  style="position: absolute; left: 14px"
                />
                <span class="w-100 text-center">Continue with Google</span>
              </button>
              <p class="signup-text text-center mt-3 mb-0">
                Don't have an account? <a href="signup.html">Sign UP</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      const form = document.querySelector(".needs-validation");
      form.addEventListener("submit", function (e) {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add("was-validated");
      });

      // Eye toggle
      document
        .getElementById("togglePassword")
        .addEventListener("click", function () {
          const input = document.getElementById("password");
          const icon = document.getElementById("eyeIcon");

          if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
          } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
          }
        });
    </script>
  </body>
</html>
